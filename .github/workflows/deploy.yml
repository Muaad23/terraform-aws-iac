name: 🧱 Build • 🧪 Test • 🚀 Deploy Demo (via SSM)

on:
  push:
    branches:
      - main

jobs:
  # -------------------------
  # 🏗️ BUILD STAGE
  # -------------------------
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 🧰 Checkout code
        uses: actions/checkout@v4

      - name: 🏗️ Simulate build
        run: |
          echo "Building the project..."
          sleep 3
          echo "✅ Build complete!"

      - name: 📦 Upload fake artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-artifact
          path: .
  
  # -------------------------
  # 🧪 TEST STAGE
  # -------------------------
  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 📥 Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: demo-artifact

      - name: 🧪 Simulate tests
        run: |
          echo "Running sample tests..."
          sleep 2
          echo "✅ All tests passed!"

  # -------------------------
  # 🚀 DEPLOY STAGE
  # -------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 🧰 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-2

      - name: 🚀 Simulate deploy via AWS SSM
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=ip-address,Values=${{ secrets.EC2_IP }}" \
            --query "Reservations[0].Instances[0].InstanceId" \
            --output text)

          echo "Deploying to instance: $INSTANCE_ID"
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions Test Deployment" \
            --parameters 'commands=[
              "echo Deploying demo files...",
              "echo $(date) > /var/www/html/deployment_log.txt",
              "echo ✅ Demo deployment complete!"
            ]'
